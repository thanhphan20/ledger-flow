spring:
  # This file replaces src/main/resources/application.yml entirely on the test classpath (Spring
  # Boot loads whichever application.yml it finds first, it does not merge the two), so anything
  # the app needs at runtime has to be repeated here rather than just listing overrides.
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    consumer:
      group-id: ledger-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.ledgerflow.contracts.events
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.ledgerflow.contracts.events.PaymentCompletedEvent
    listener:
      ack-mode: RECORD

  datasource:
    url: jdbc:h2:mem:ledgertest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    baseline-on-migrate: true
