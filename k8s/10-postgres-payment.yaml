apiVersion: v1
kind: Secret
metadata:
  name: postgres-payment-credentials
  namespace: ledger-flow
type: Opaque
stringData:
  # Dev-only value, matching docker-compose.yml. A real deployment must supply its own.
  POSTGRES_PASSWORD: password
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-payment-data
  namespace: ledger-flow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-payment
  namespace: ledger-flow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-payment
  # RollingUpdate would try to start a second pod against the same ReadWriteOnce PVC on
  # any future re-apply, which hangs. Recreate tears the old pod down first.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres-payment
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: ledgerflow_payment
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-payment-credentials
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-payment-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-payment
  namespace: ledger-flow
spec:
  selector:
    app: postgres-payment
  ports:
    - port: 5432
      targetPort: 5432
