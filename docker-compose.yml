services:
  postgres-payment:
    image: postgres:16
    environment:
      POSTGRES_DB: ledgerflow_payment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-payment-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-ledger:
    image: postgres:16
    environment:
      POSTGRES_DB: ledgerflow_ledger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres-ledger-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-loan:
    image: postgres:16
    environment:
      POSTGRES_DB: ledgerflow_loan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - postgres-loan-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-node Kafka in KRaft mode (no Zookeeper). PLAINTEXT is for other containers on this
  # compose network (e.g. kafka:19092); PLAINTEXT_HOST is for tools running on the host machine
  # (e.g. a console consumer at localhost:9092).
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Web UI for browsing topics/messages/consumer lag while learning Kafka.
  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:19092

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-payment:5432/ledgerflow_payment
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # Dev-only value for the local compose stack. jwt.secret has no fallback in
      # application.yml on purpose (fails closed rather than booting with a known key) - a real
      # deployment must supply its own value here instead of reusing this one.
      JWT_SECRET: dev-only-insecure-jwt-signing-key-change-me-1234567890
    depends_on:
      postgres-payment:
        condition: service_healthy
      kafka:
        condition: service_healthy

  ledger-service:
    build:
      context: .
      dockerfile: ledger-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-ledger:5432/ledgerflow_ledger
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      postgres-ledger:
        condition: service_healthy
      kafka:
        condition: service_healthy

  loan-service:
    build:
      context: .
      dockerfile: loan-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-loan:5432/ledgerflow_loan
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # Dev-only value for the local compose stack, same rationale as payment-service's.
      JWT_SECRET: dev-only-insecure-jwt-signing-key-change-me-1234567890
    depends_on:
      postgres-loan:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  postgres-payment-data:
  postgres-ledger-data:
  postgres-loan-data:
