server:
  port: 8081

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://localhost:5432/ledgerflow_payment
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    properties:
      spring.json.add.type.headers: false

management:
  endpoints:
    web:
      exposure:
        include: health

# Dev-only placeholder - override via the JWT_SECRET env var in any real deployment. HS256
# requires a key of at least 32 bytes (256 bits); Nimbus throws at bean-creation time (the app
# fails to boot, not just JWT requests) if this is ever shortened below that.
jwt:
  secret: ${JWT_SECRET:dev-only-insecure-jwt-signing-key-change-me-1234567890}
