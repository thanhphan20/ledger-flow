server:
  port: 8081

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://localhost:5432/ledgerflow_payment
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    properties:
      spring.json.add.type.headers: false

  flyway:
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health

# No default here deliberately: a checked-in fallback would mean any deployment that forgets to
# set JWT_SECRET boots successfully with a signing key anyone can read from this public repo,
# silently minting forgeable tokens. Fails closed instead - the app won't start without it. HS256
# also requires a key of at least 32 bytes (256 bits); Nimbus throws at bean-creation time either
# way if it's ever set below that. docker-compose.yml and the IntelliJ run config supply a
# dev-only value for local use; CI's docker-compose-e2e job gets it from docker-compose.yml too.
jwt:
  secret: ${JWT_SECRET}
