name: Maven CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: ledgerflow_payment
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }}

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Make Maven Wrapper Executable
      run: chmod +x mvnw

    # ledger-service and payment-service each own their own database; the postgres service
    # container above only creates ledgerflow_payment at startup (via POSTGRES_DB), so
    # ledgerflow_ledger needs to be created explicitly before the build/tests run.
    - name: Create ledger-service database
      run: PGPASSWORD=password psql -h localhost -U postgres -c "CREATE DATABASE ledgerflow_ledger;"

    - name: Format, Fix and Build with Maven
      run: ./mvnw clean spotless:apply install -B

  docker-compose-e2e:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }}

    # Builds both service images from their Dockerfiles and brings up the full stack (2
    # Postgres instances, Kafka, Kafdrop, both services) exactly as a local `docker compose up`
    # would. --wait blocks until every service with a healthcheck (both Postgres containers,
    # Kafka) reports healthy before moving on.
    - name: Build images and start the stack
      run: docker compose up -d --build --wait --wait-timeout 180

    - name: Wait for payment-service and ledger-service to accept traffic
      run: |
        for port in 8081 8082; do
          echo "Waiting for service on port $port..."
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:$port/actuator/health" > /dev/null; then
              echo "port $port is up"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "port $port never became healthy"
              exit 1
            fi
            sleep 2
          done
        done

    # Real end-to-end check: log in for a JWT, post a payment through payment-service, let it
    # flow over the real Kafka broker into ledger-service, and confirm a LedgerEntry actually
    # landed in ledger-service's own Postgres database (mapped to host port 5433 in
    # docker-compose.yml). jq is preinstalled on GitHub-hosted runners.
    - name: Post a payment and verify it reaches ledger-service via Kafka
      run: |
        TOKEN=$(curl -sf -X POST http://localhost:8081/api/v1/auth/login \
          -H "Content-Type: application/json" \
          -d '{"username": "demo", "password": "demo-password"}' | jq -r '.token')
        curl -sf -X POST http://localhost:8081/api/v1/payments \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer $TOKEN" \
          -d '{"userId": 1, "amount": 10.00, "currency": "USD", "idempotencyKey": "ci-e2e-check"}'
        echo
        echo "Waiting for the event to flow through Kafka into ledger-service..."
        sleep 8
        sudo apt-get update -y -qq && sudo apt-get install -y -qq postgresql-client
        COUNT=$(PGPASSWORD=password psql -h localhost -p 5433 -U postgres -d ledgerflow_ledger -tAc \
          "SELECT count(*) FROM ledger_entries;")
        echo "ledger_entries count: $COUNT"
        if [ "$COUNT" -lt 1 ]; then
          echo "Payment never produced a ledger entry - Kafka wiring or Dockerfiles are broken."
          exit 1
        fi

    - name: Dump container logs on failure
      if: failure()
      run: docker compose logs

    - name: Tear down
      if: always()
      run: docker compose down -v

