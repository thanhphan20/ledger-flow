name: Maven CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: ledgerflow_payment
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.head_ref }}

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Make Maven Wrapper Executable
      run: chmod +x mvnw

    # ledger-service and payment-service each own their own database; the postgres service
    # container above only creates ledgerflow_payment at startup (via POSTGRES_DB), so
    # ledgerflow_ledger needs to be created explicitly before the build/tests run.
    - name: Create ledger-service database
      run: PGPASSWORD=password psql -h localhost -U postgres -c "CREATE DATABASE ledgerflow_ledger;"

    - name: Create loan-service database
      run: PGPASSWORD=password psql -h localhost -U postgres -c "CREATE DATABASE ledgerflow_loan;"

    - name: Format, Fix and Build with Maven
      run: ./mvnw clean spotless:apply install -B

